<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${site.name} + ' · Stock'">Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container flex-grow-1 py-4">

    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

    <h3 class="fw-bold" style="color:#1E3A8A;">
        <i class="bi bi-box-seam me-1"></i>
        <span th:text="${site.name}"></span> · Materials & Stock
    </h3>

    <ul class="nav nav-tabs mt-3">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#stock">Stock levels</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#movements">Movements</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#requests">My requests</a></li>
    </ul>

    <div class="tab-content border border-top-0 p-3 bg-white">

        <!-- Stock -->
        <div class="tab-pane fade show active" id="stock">
            <table class="table align-middle">
                <thead><tr><th>Material</th><th>Unit</th><th>On hand</th><th>Threshold</th><th></th></tr></thead>
                <tbody>
                    <tr th:each="m : ${materials}"
                        th:with="onHand=${stockByMaterial[m.id]}">
                        <td th:text="${m.name}"></td>
                        <td th:text="${m.unit}"></td>
                        <td>
                            <strong th:text="${onHand}"></strong>
                            <span th:if="${onHand <= m.reorderThreshold}"
                                  class="badge bg-danger ms-1">Low</span>
                        </td>
                        <td th:text="${m.reorderThreshold}"></td>
                        <td>
                            <button type="button" class="btn btn-sm btn-outline-primary"
                                    data-bs-toggle="modal"
                                    th:attr="data-bs-target='#req-'+${m.id}">
                                Request
                            </button>

                            <!-- Request modal -->
                            <div class="modal fade" th:id="'req-'+${m.id}" tabindex="-1">
                                <div class="modal-dialog"><div class="modal-content">
                                    <form th:action="@{|/engineer/sites/${site.id}/stock/request|}" method="post">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Request <span th:text="${m.name}"></span></h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body">
                                            <input type="hidden" name="materialId" th:value="${m.id}" />
                                            <label class="form-label">Quantity (<span th:text="${m.unit}"></span>)</label>
                                            <input type="number" name="qty" min="1" class="form-control" required />
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                            <button class="btn btn-primary" style="background:#1E3A8A;border:none;">Submit</button>
                                        </div>
                                    </form>
                                </div></div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Record movement -->
            <h6 class="mt-4">Record a stock movement</h6>
            <form th:action="@{|/engineer/sites/${site.id}/stock/movement|}" method="post"
                  class="row g-2 align-items-end">
                <div class="col-md-3">
                    <select name="materialId" class="form-select" required>
                        <option value="">— Material —</option>
                        <option th:each="m : ${materials}" th:value="${m.id}"
                                th:text="${m.name + ' (' + m.unit + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-2"><input type="number" name="qty" min="1" class="form-control" placeholder="Qty" required /></div>
                <div class="col-md-2">
                    <select name="type" class="form-select">
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="col-md-3"><input name="note" class="form-control" placeholder="Note (optional)" /></div>
                <div class="col-md-2"><button class="btn btn-primary w-100" style="background:#1E3A8A;border:none;">Record</button></div>
            </form>
        </div>

        <!-- Movements -->
        <div class="tab-pane fade" id="movements">
            <table class="table align-middle">
                <thead><tr><th>When</th><th>Material</th><th>Qty</th><th>Type</th><th>Note</th></tr></thead>
                <tbody>
                    <tr th:each="m : ${movements}">
                        <td th:text="${#temporals.format(m.timestamp,'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${m.material.name}"></td>
                        <td th:text="${m.qty + ' ' + m.material.unit}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${m.type.name() == 'IN'} ? 'bg-success' : 'bg-warning text-dark'"
                                  th:text="${m.type}"></span>
                        </td>
                        <td th:text="${m.note} ?: '—'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(movements)}">
                        <td colspan="5" class="text-center text-muted py-3">No movements yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Requests -->
        <div class="tab-pane fade" id="requests">
            <table class="table align-middle">
                <thead><tr><th>When</th><th>Material</th><th>Qty</th><th>Status</th></tr></thead>
                <tbody>
                    <tr th:each="r : ${requests}">
                        <td th:text="${#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${r.material.name}"></td>
                        <td th:text="${r.qty + ' ' + r.material.unit}"></td>
                        <td><span class="badge bg-info text-dark" th:text="${r.status}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="4" class="text-center text-muted py-3">No requests yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
