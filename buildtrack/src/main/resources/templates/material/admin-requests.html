<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Material Requests · BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container flex-grow-1 py-4">
    <h3 class="fw-bold mb-3" style="color:#1E3A8A;">
        <i class="bi bi-inbox me-1"></i> Material Requests
    </h3>
    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

    <table class="table align-middle bg-white">
        <thead class="table-light"><tr>
            <th>When</th><th>Site</th><th>Material</th><th>Qty</th><th>By</th><th>Status</th><th>Update</th>
        </tr></thead>
        <tbody>
            <tr th:each="r : ${requests}">
                <td th:text="${#temporals.format(r.createdAt,'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${r.site.name}"></td>
                <td th:text="${r.material.name}"></td>
                <td th:text="${r.qty + ' ' + r.material.unit}"></td>
                <td th:text="${r.requestedBy?.fullName} ?: '—'"></td>
                <td><span class="badge bg-info text-dark" th:text="${r.status}"></span></td>
                <td>
                    <form th:action="@{|/admin/requests/${r.id}/status|}" method="post" class="d-flex gap-2">
                        <select name="status" class="form-select form-select-sm">
                            <option value="PENDING"   th:selected="${r.status.name()=='PENDING'}">PENDING</option>
                            <option value="APPROVED"  th:selected="${r.status.name()=='APPROVED'}">APPROVED</option>
                            <option value="ORDERED"   th:selected="${r.status.name()=='ORDERED'}">ORDERED</option>
                            <option value="FULFILLED" th:selected="${r.status.name()=='FULFILLED'}">FULFILLED</option>
                            <option value="REJECTED"  th:selected="${r.status.name()=='REJECTED'}">REJECTED</option>
                        </select>
                        <button class="btn btn-sm btn-primary" style="background:#1E3A8A;border:none;">Save</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(requests)}">
                <td colspan="7" class="text-center text-muted py-3">No requests yet.</td>
            </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
