<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Materials · BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container flex-grow-1 py-4">
    <h3 class="fw-bold mb-3" style="color:#1E3A8A;">
        <i class="bi bi-box-seam me-1"></i> Materials
    </h3>
    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light"><tr>
                    <th>Name</th><th>Unit</th><th>Reorder threshold</th><th></th>
                </tr></thead>
                <tbody>
                    <tr th:each="m : ${materials}">
                        <td th:text="${m.name}"></td>
                        <td th:text="${m.unit}"></td>
                        <td th:text="${m.reorderThreshold}"></td>
                        <td>
                            <form method="post" th:action="@{|/admin/materials/${m.id}/delete|}"
                                  onsubmit="return confirm('Delete material?');" class="d-inline">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(materials)}">
                        <td colspan="4" class="text-center text-muted py-3">No materials yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <form th:action="@{/admin/materials}" th:object="${newMaterial}" method="post"
          class="row g-2 align-items-end mt-3">
        <div class="col-md-4">
            <label class="form-label">Name</label>
            <input th:field="*{name}" class="form-control" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Unit</label>
            <input th:field="*{unit}" class="form-control" placeholder="bag, kg, m3…" required />
        </div>
        <div class="col-md-3">
            <label class="form-label">Reorder threshold</label>
            <input type="number" min="0" th:field="*{reorderThreshold}" class="form-control" />
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" style="background:#1E3A8A;border:none;">Add</button>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
