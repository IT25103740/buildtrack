<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Suppliers · BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container flex-grow-1 py-4">
    <h3 class="fw-bold mb-3" style="color:#1E3A8A;">
        <i class="bi bi-truck me-1"></i> Suppliers
    </h3>
    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

    <table class="table align-middle bg-white">
        <thead class="table-light"><tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Login user</th><th></th>
        </tr></thead>
        <tbody>
            <tr th:each="s : ${suppliers}">
                <td th:text="${s.name}"></td>
                <td th:text="${s.contactEmail} ?: '—'"></td>
                <td th:text="${s.phone} ?: '—'"></td>
                <td th:text="${s.address} ?: '—'"></td>
                <td th:text="${s.user?.email} ?: '—'"></td>
                <td>
                    <form method="post" th:action="@{|/admin/suppliers/${s.id}/delete|}"
                          onsubmit="return confirm('Delete supplier?');" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(suppliers)}">
                <td colspan="6" class="text-center text-muted py-3">No suppliers yet.</td>
            </tr>
        </tbody>
    </table>

    <form th:action="@{/admin/suppliers}" th:object="${newSupplier}" method="post"
          class="row g-2 align-items-end mt-3">
        <div class="col-md-3"><input th:field="*{name}" class="form-control" placeholder="Name" required /></div>
        <div class="col-md-3"><input th:field="*{contactEmail}" class="form-control" placeholder="Email" /></div>
        <div class="col-md-2"><input th:field="*{phone}" class="form-control" placeholder="Phone" /></div>
        <div class="col-md-3"><input th:field="*{address}" class="form-control" placeholder="Address" /></div>
        <div class="col-md-1"><button class="btn btn-primary w-100" style="background:#1E3A8A;border:none;">Add</button></div>
        <div class="col-md-6 mt-2">
            <label class="form-label small mb-1">Link to supplier login user (optional)</label>
            <select name="userId" class="form-select">
                <option value="">— None —</option>
                <option th:each="u : ${supplierUsers}" th:value="${u.id}" th:text="${u.email}"></option>
            </select>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
