<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Orders · BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container flex-grow-1 py-4">
    <h3 class="fw-bold mb-3" style="color:#1E3A8A;">
        <i class="bi bi-receipt me-1"></i> My Orders
    </h3>
    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

    <div class="row g-3">
        <div class="col-md-6" th:each="po : ${orders}">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h6 class="fw-bold mb-0">Order #<span th:text="${po.id}"></span></h6>
                        <span class="badge bg-secondary" th:text="${po.status}"></span>
                    </div>
                    <div class="text-muted small" th:text="${#temporals.format(po.createdAt,'yyyy-MM-dd HH:mm')}"></div>

                    <ul class="list-unstyled mt-2 small">
                        <li th:each="it : ${po.items}">
                            <i class="bi bi-dot"></i>
                            <span th:text="${it.material.name + ' × ' + it.qty + ' ' + it.material.unit}"></span>
                            — LKR <span th:text="${#numbers.formatDecimal(it.unitPrice,0,'COMMA',2,'POINT')}"></span>
                        </li>
                    </ul>
                    <div class="mt-1 fw-semibold">
                        Total: LKR <span th:text="${#numbers.formatDecimal(po.total,0,'COMMA',2,'POINT')}"></span>
                    </div>

                    <form th:action="@{|/supplier/orders/${po.id}/status|}" method="post"
                          class="row g-2 align-items-end mt-3">
                        <div class="col-8">
                            <select name="status" class="form-select form-select-sm">
                                <option value="SENT"      th:selected="${po.status.name()=='SENT'}">SENT</option>
                                <option value="CONFIRMED" th:selected="${po.status.name()=='CONFIRMED'}">CONFIRMED</option>
                                <option value="DELIVERED" th:selected="${po.status.name()=='DELIVERED'}">DELIVERED</option>
                                <option value="CANCELLED" th:selected="${po.status.name()=='CANCELLED'}">CANCELLED</option>
                            </select>
                        </div>
                        <div class="col-4">
                            <button class="btn btn-sm btn-primary w-100" style="background:#1E3A8A;border:none;">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(orders)}" class="col-12 text-muted">No orders assigned to you yet.</div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
