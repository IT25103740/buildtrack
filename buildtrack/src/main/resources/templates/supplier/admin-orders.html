<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Purchase Orders · BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container flex-grow-1 py-4">
    <h3 class="fw-bold mb-3" style="color:#1E3A8A;">
        <i class="bi bi-receipt me-1"></i> Purchase Orders
    </h3>
    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h6>Raise a PO from an approved material request</h6>
            <form th:action="@{/admin/orders/raise}" method="post" class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label small">Request</label>
                    <select name="requestId" class="form-select" required>
                        <option value="">— Choose approved request —</option>
                        <option th:each="r : ${requests}" th:value="${r.id}"
                                th:text="${r.material.name + ' × ' + r.qty + ' ' + r.material.unit + ' — ' + r.site.name}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Supplier</label>
                    <select name="supplierId" class="form-select" required>
                        <option value="">— Choose supplier —</option>
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Unit price (LKR)</label>
                    <input type="number" step="0.01" min="0" name="unitPrice" class="form-control" required />
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" style="background:#1E3A8A;border:none;">Raise PO</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table align-middle bg-white">
        <thead class="table-light"><tr>
            <th>#</th><th>When</th><th>Supplier</th><th>Project</th><th>Items</th><th>Total</th><th>Status</th>
        </tr></thead>
        <tbody>
            <tr th:each="po : ${orders}">
                <td>#<span th:text="${po.id}"></span></td>
                <td th:text="${#temporals.format(po.createdAt,'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${po.supplier.name}"></td>
                <td th:text="${po.project?.name} ?: '—'"></td>
                <td>
                    <div th:each="it : ${po.items}" class="small">
                        <span th:text="${it.material.name + ' × ' + it.qty + ' ' + it.material.unit}"></span>
                        @ <span th:text="'LKR ' + ${#numbers.formatDecimal(it.unitPrice,0,'COMMA',2,'POINT')}"></span>
                    </div>
                </td>
                <td th:text="'LKR ' + ${#numbers.formatDecimal(po.total,0,'COMMA',2,'POINT')}"></td>
                <td><span class="badge bg-secondary" th:text="${po.status}"></span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(orders)}">
                <td colspan="7" class="text-center text-muted py-3">No purchase orders yet.</td>
            </tr>
        </tbody>
    </table>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
