<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background:#1E3A8A;">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-building-fill me-1"></i> BuildTrack
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>

                <!-- Not logged in -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-warning btn-sm ms-2 fw-semibold text-dark" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm ms-2" th:href="@{/register}">Register</a>
                </li>

                <!-- Logged in -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','PROJECT_MANAGER')">
                    <a class="nav-link" th:href="@{/projects}">
                        <i class="bi bi-diagram-3 me-1"></i> Projects
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('SITE_ENGINEER')">
                    <a class="nav-link" th:href="@{/engineer/sites}">
                        <i class="bi bi-geo-alt me-1"></i> Sites
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('WORKER')">
                    <a class="nav-link" th:href="@{/worker/tasks}">
                        <i class="bi bi-list-check me-1"></i> My Tasks
                    </a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" role="button">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="principal.user.fullName">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <span class="dropdown-item-text small text-muted">
                                Role:
                                <strong sec:authentication="principal.user.role.name">-</strong>
                            </span>
                        </li>
                        <li><hr class="dropdown-divider" /></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3 py-1">
                                <button class="btn btn-sm btn-outline-danger w-100" type="submit">
                                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
