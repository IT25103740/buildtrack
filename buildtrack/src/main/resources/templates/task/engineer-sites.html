<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>My Sites · BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container flex-grow-1 py-4">
    <h3 class="fw-bold mb-3" style="color:#1E3A8A;">
        <i class="bi bi-geo-alt me-1"></i> Sites
    </h3>

    <div class="row g-3">
        <div class="col-md-4" th:each="s : ${sites}">
            <a class="text-decoration-none" th:href="@{|/engineer/sites/${s.id}|}">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="fw-bold mb-1" th:text="${s.name}"></h6>
                        <div class="small text-muted" th:text="${s.location} ?: '—'"></div>
                        <div class="mt-2 small">
                            Project: <strong th:text="${s.project.name}"></strong>
                        </div>
                        <span class="badge bg-info text-dark mt-2" th:text="${s.status}"></span>
                    </div>
                </div>
            </a>
        </div>
        <div th:if="${#lists.isEmpty(sites)}" class="col-12 text-muted">No sites yet.</div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
