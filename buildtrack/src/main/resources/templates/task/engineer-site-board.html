<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${site.name} + ' · Board'">Site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container flex-grow-1 py-4">

    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

    <h3 class="fw-bold" style="color:#1E3A8A;" th:text="${site.name}"></h3>
    <div class="text-muted mb-3">
        <span th:text="${site.location} ?: ''"></span> · Project:
        <a th:href="@{|/projects/${site.project.id}|}" th:text="${site.project.name}"></a>
    </div>
    <a class="btn btn-sm btn-outline-primary mb-3"
       th:href="@{|/engineer/sites/${site.id}/stock|}">
        <i class="bi bi-box-seam me-1"></i> Materials & Stock
    </a>

    <ul class="nav nav-tabs">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tasks">Tasks</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#attendance">Attendance</a></li>
    </ul>

    <div class="tab-content border border-top-0 p-3 bg-white">

        <!-- Tasks tab -->
        <div class="tab-pane fade show active" id="tasks">
            <table class="table align-middle">
                <thead><tr><th>Title</th><th>Assignee</th><th>Due</th><th>Progress</th><th>Status</th><th></th></tr></thead>
                <tbody>
                    <tr th:each="t : ${tasks}">
                        <td>
                            <div class="fw-semibold" th:text="${t.title}"></div>
                            <div class="text-muted small" th:text="${t.description}"></div>
                        </td>
                        <td th:text="${t.assignee?.fullName} ?: '—'"></td>
                        <td th:text="${t.dueDate} ?: '—'"></td>
                        <td>
                            <div class="progress" style="height:8px;">
                                <div class="progress-bar" role="progressbar" th:style="'width:'+${t.progressPct}+'%'"></div>
                            </div>
                            <div class="small text-muted" th:text="${t.progressPct} + '%'"></div>
                        </td>
                        <td><span class="badge bg-secondary" th:text="${t.status}"></span></td>
                        <td>
                            <form method="post" th:action="@{|/engineer/sites/${site.id}/tasks/${t.id}/delete|}"
                                  onsubmit="return confirm('Delete task?');" class="d-inline">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tasks)}">
                        <td colspan="6" class="text-center text-muted py-3">No tasks yet.</td>
                    </tr>
                </tbody>
            </table>

            <form th:action="@{|/engineer/sites/${site.id}/tasks|}" th:object="${newTask}" method="post"
                  class="row g-2 align-items-end">
                <div class="col-md-3"><input th:field="*{title}" class="form-control" placeholder="Task title" required /></div>
                <div class="col-md-3"><input th:field="*{description}" class="form-control" placeholder="Description" /></div>
                <div class="col-md-2">
                    <select name="assigneeId" class="form-select">
                        <option value="">— Assign worker —</option>
                        <option th:each="w : ${workers}" th:value="${w.id}" th:text="${w.fullName}"></option>
                    </select>
                </div>
                <div class="col-md-2"><input type="date" th:field="*{dueDate}" class="form-control" /></div>
                <div class="col-md-1">
                    <select th:field="*{status}" class="form-select">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="col-md-1"><button class="btn btn-primary w-100" style="background:#1E3A8A;border:none;">Add</button></div>
            </form>
        </div>

        <!-- Attendance tab -->
        <div class="tab-pane fade" id="attendance">
            <form class="row g-2 align-items-end mb-3" method="get" th:action="@{|/engineer/sites/${site.id}|}">
                <div class="col-auto">
                    <label class="form-label small mb-0">Date</label>
                    <input type="date" name="date" class="form-control" th:value="${date}" />
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-primary">View</button>
                </div>
            </form>

            <table class="table align-middle">
                <thead><tr><th>Worker</th><th>Date</th><th>Status</th></tr></thead>
                <tbody>
                    <tr th:each="a : ${attendance}">
                        <td th:text="${a.worker.fullName}"></td>
                        <td th:text="${a.date}"></td>
                        <td><span class="badge bg-success" th:text="${a.status}"></span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(attendance)}">
                        <td colspan="3" class="text-center text-muted py-3">No attendance recorded for this date.</td>
                    </tr>
                </tbody>
            </table>

            <form th:action="@{|/engineer/sites/${site.id}/attendance|}" method="post"
                  class="row g-2 align-items-end">
                <div class="col-md-4">
                    <select name="workerId" class="form-select" required>
                        <option value="">— Worker —</option>
                        <option th:each="w : ${workers}" th:value="${w.id}" th:text="${w.fullName}"></option>
                    </select>
                </div>
                <div class="col-md-3"><input type="date" name="date" class="form-control" th:value="${date}" required /></div>
                <div class="col-md-3">
                    <select name="status" class="form-select" required>
                        <option th:each="s : ${attStatuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="col-md-2"><button class="btn btn-primary w-100" style="background:#1E3A8A;border:none;">Record</button></div>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
