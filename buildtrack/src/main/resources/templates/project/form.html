<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Project · BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container flex-grow-1 py-4">
    <h3 class="fw-bold" style="color:#1E3A8A;">
        <i class="bi bi-diagram-3 me-1"></i>
        <span th:text="${project.id == null} ? 'New project' : 'Edit project'">Project</span>
    </h3>

    <form th:action="${project.id == null} ? @{/projects} : @{|/projects/${project.id}|}"
          th:object="${project}" method="post" class="card card-body shadow-sm border-0 mt-3">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Project Manager</label>
                <select name="pmId" class="form-select">
                    <option value="">— None —</option>
                    <option th:each="u : ${users}" th:value="${u.id}"
                            th:selected="${project.projectManager != null and project.projectManager.id == u.id}"
                            th:text="${u.fullName + ' (' + u.role.name + ')'}"></option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Client</label>
                <select name="clientId" class="form-select">
                    <option value="">— None —</option>
                    <option th:each="u : ${users}" th:value="${u.id}"
                            th:selected="${project.client != null and project.client.id == u.id}"
                            th:text="${u.fullName + ' (' + u.role.name + ')'}"></option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Budget (LKR)</label>
                <input type="number" step="0.01" th:field="*{budget}" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Start date</label>
                <input type="date" th:field="*{startDate}" class="form-control" />
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">End date</label>
                <input type="date" th:field="*{endDate}" class="form-control" />
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select th:field="*{status}" class="form-select">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/projects}">Cancel</a>
            <button class="btn btn-primary" style="background:#1E3A8A;border:none;">Save</button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
