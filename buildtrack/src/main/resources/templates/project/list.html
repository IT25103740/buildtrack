<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Projects · BuildTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0" style="color:#1E3A8A;">
            <i class="bi bi-diagram-3 me-1"></i> Projects
        </h3>
        <a class="btn btn-primary" th:href="@{/projects/new}" style="background:#1E3A8A;border:none;">
            <i class="bi bi-plus-lg me-1"></i> New project
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Name</th><th>Client</th><th>PM</th><th>Budget</th>
                        <th>Start</th><th>End</th><th>Status</th><th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${projects}">
                        <td><a th:href="@{|/projects/${p.id}|}" th:text="${p.name}">-</a></td>
                        <td th:text="${p.client?.fullName} ?: '—'">—</td>
                        <td th:text="${p.projectManager?.fullName} ?: '—'">—</td>
                        <td th:text="${p.budget != null} ? 'LKR ' + ${#numbers.formatDecimal(p.budget,0,'COMMA',2,'POINT')} : '—'">—</td>
                        <td th:text="${p.startDate} ?: '—'">—</td>
                        <td th:text="${p.endDate} ?: '—'">—</td>
                        <td><span class="badge bg-secondary" th:text="${p.status}"></span></td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{|/projects/${p.id}/edit|}">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(projects)}">
                        <td colspan="8" class="text-center text-muted py-4">No projects yet. Click "New project" to create one.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
