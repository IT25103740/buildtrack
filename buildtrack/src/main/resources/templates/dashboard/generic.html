<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${role} + ' Dashboard · BuildTrack'">Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link th:href="@{/css/app.css}" rel="stylesheet" />
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container flex-grow-1 py-5">
    <div class="d-flex align-items-center mb-4">
        <i class="bi bi-speedometer2 fs-2 me-2" style="color:#1E3A8A;"></i>
        <h2 class="fw-bold mb-0" style="color:#1E3A8A;">
            <span th:text="${role}"></span> Dashboard
        </h2>
    </div>

    <div sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
         class="alert alert-info">
        Welcome, <strong sec:authentication="principal.user.fullName">User</strong>!
        You are logged in as <em th:text="${role}"></em>.
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h5>Coming in the next sprints…</h5>
            <p class="text-muted mb-0">
                Sprint 2 will populate this dashboard with the modules relevant to your role
                (projects, tasks, materials, procurement, finance, or reports).
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
