# ===== BuildTrack — Dev Config =====
spring.application.name=buildtrack

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/buildtrack_dev?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=buildtrack
spring.datasource.password=BuildTrack@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Server ----
server.port=8080
server.servlet.session.timeout=30m

# ---- Mail (fill later; leave blank for now) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- File uploads ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
buildtrack.uploads.dir=./uploads
